<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotivibes</title>

  <link rel="stylesheet" href="css/main.css">
</head>

<body>

  <!-- APP WRAPPER -->
  <div id="app">

    <!-- LEFT SIDEBAR -->
    <aside id="sidebar-left">

      <div class="logo">Spotivibes</div>

      <div id="userBox">Loading...</div>

      <nav>
        <button data-page="home">Home</button>
        <button data-page="library">Library</button>
        <button data-page="queue">Queue</button>
        <button id="logoutBtn">Logout</button>
      </nav>

      <div id="playlistContainer"></div>

    </aside>

    <!-- CENTER AREA -->
    <main id="main">
      
      <section id="searchView" class="view hidden">

        <header id="appHeader">
          <div id="searchBarWrapper">
            <input
              id="searchBar"
              placeholder="Search songs..."
              data-ui="search-input"
            />

            <div id="searchDropdown" class="search-dropdown hidden"></div>
          </div>
        </header>

        <h2>Search Results</h2>

        <div id="searchList"></div>

      </section>

      <section id="homeView" class="view">
        <h2>Made For You</h2>
        <div id="topSongsGrid"></div>

        <h2>Recently Uploaded</h2>
        <div id="recentGrid"></div>
      </section>

      <section id="libraryView" class="view hidden">
        <h2>Your Library</h2>
        <div id="libraryList"></div>
      </section>

      <section id="queueView" class="view hidden">
        <h2>Queue</h2>
        <div id="queueList"></div>
      </section>

    </main>

    <!-- RIGHT SIDEBAR -->
    <aside id="sidebar-right">

      <div id="nowPlayingCard">
        <div id="albumArt"></div>
        <div id="nowPlayingText">Not Playing</div>
      </div>

      <div id="lyricsBox">
        <h3>Lyrics</h3>
        <pre id="lyricsText">No lyrics loaded</pre>
      </div>

    </aside>

  </div>

  <!-- DESKTOP PLAYER BAR -->
  <header id="playerBar">

    <div id="playerControls">
      <button id="shuffleBtn">🔀</button>
      <button id="prevBtn">⏮</button>
      <button id="playBtn">▶</button>
      <button id="nextBtn">⏭</button>
      <button id="repeatBtn">🔁</button>
    </div>

    <div id="progressWrapper">

      <span id="currentTime">0:00</span>

      <input
        id="progressBar"
        type="range"
        min="0"
        max="100"
        value="0"
      />

      <span id="duration">0:00</span>

      <div id="progressTooltip"></div>
    </div>

  </header>

  <!-- MOBILE NAV -->
  <div id="mobileNav">
    <button data-page="home">
      <img src="assets/icons/home.svg">
      <span>Home</span>
    </button>

    <button data-page="search">
      <img src="assets/icons/search.svg">
      <span>Search</span>
    </button>

    <button data-page="library">
      <img src="assets/icons/library.svg">
      <span>Library</span>
    </button>

    <button id="moreBtn">
      <img src="assets/icons/more.svg">
      <span>More</span>
    </button>
  </div>

  <!-- MORE SHEET -->
  <div id="moreSheet" class="hidden">
    <button id="openQueue">Queue</button>
    <button id="openLyrics">Lyrics</button>
    <button id="openInfo">Song Info</button>
  </div>

  <!-- MOBILE MINI PLAYER -->
  <div id="miniPlayer">

    <div id="miniLeft">

      <div id="miniAlbumArt"></div>

      <div id="miniMeta">
        <div id="miniInfo">Not Playing</div>

        <!-- MOBILE PROGRESS BAR -->
        <input
          id="miniProgressBar"
          type="range"
          min="0"
          max="100"
          value="0"
        />
      </div>

    </div>

    <div id="miniControls">
      <button id="miniPrevBtn">⏮</button>
      <button id="miniPlayBtn">▶</button>
      <button id="miniNextBtn">⏭</button>
    </div>

  </div>

  <!-- AUDIO ENGINE -->
  <audio id="audio"></audio>

  <!-- JS ORDER -->
  <script src="js/constants.js"></script>
  <script src="js/api.js"></script>
  <script src="js/player.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
