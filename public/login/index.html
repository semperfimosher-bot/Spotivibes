<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotivibes Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(circle at top left, rgba(0,76,255,0.35), transparent 32%),
        radial-gradient(circle at bottom right, rgba(0,20,120,0.45), transparent 35%),
        #050505;

      overflow: hidden;
    }

    .glow {
      position: fixed;
      width: 360px;
      height: 360px;
      background: rgba(0,76,255,0.22);
      filter: blur(80px);
      border-radius: 50%;
      animation: float 7s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translate(-80px, -60px); }
      50% { transform: translate(80px, 60px); }
    }

    .box {
      position: relative;
      width: 380px;
      padding: 28px;

      background: rgba(18,18,18,0.78);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;

      box-shadow:
        0 20px 70px rgba(0,0,0,0.65),
        0 0 40px rgba(0,76,255,0.14);

      backdrop-filter: blur(18px);
    }

    h1 {
      margin: 0;
      font-size: 34px;
      letter-spacing: -1px;
    }

    .accent {
      color: #004cff;
    }

    .subtitle {
      margin: 8px 0 24px;
      color: #aaa;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      margin-bottom: 10px;

      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;

      background: rgba(255,255,255,0.06);
      color: white;
      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: rgba(0,76,255,0.7);
      box-shadow: 0 0 0 3px rgba(0,76,255,0.14);
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    button {
      flex: 1;
      padding: 12px;

      border: none;
      border-radius: 8px;

      color: white;
      cursor: pointer;
      font-weight: 700;
    }

    .primary {
      background: linear-gradient(135deg, #004cff, #001eff);
      box-shadow: 0 10px 24px rgba(0,76,255,0.28);
    }

    .secondary {
      background: rgba(255,255,255,0.08);
    }

    button:hover {
      transform: translateY(-1px);
    }

    @media (max-width: 480px) {
  body {
    padding: 16px;
    overflow-y: auto;
  }

  .box {
    width: 100%;
    max-width: 380px;
    padding: 22px;
  }

  h1 {
    font-size: 30px;
  }

  .actions {
    flex-direction: column;
  }

  button {
    width: 100%;
  }
}
  </style>
</head>

<body>

<div class="glow"></div>

<div class="box">
  <h1>Spoti<span class="accent">vibes</span></h1>
  <p class="subtitle">Your music, your playlists, your vibe.</p>

  <form id="loginForm">

  <input
    id="email"
    type="email"
    placeholder="Email"
    autocomplete="email"
  >

  <input
    id="password"
    type="password"
    placeholder="Password"
    autocomplete="current-password"
  >

  <div class="actions">
  <button
    type="submit"
    class="primary"
    id="registerSubmitBtn"
  >
    LOGIN
  </button>
</div>

</form>
</div>

<script src="/js/config.js"></script>
<script src="/js/constants.js"></script>
<script src="/js/api.js"></script>

<script src="/login/login.js"></script>

</body>
</html>
