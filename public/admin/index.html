<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>

  <style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0d0d0d;
    color: white;
  }

  .app {
    display: flex;
    height: 100vh;
  }

  .sidebar {
    width: 220px;
    padding: 20px;
    background: #000;
  }

  .sidebar h2 {
    color: #0000ff;
  }

  .sidebar p {
    padding: 10px;
    cursor: pointer;
  }

  .sidebar p:hover {
    color: #0d00ff;
  }

  .main {
    flex: 1;
    padding: 30px;
    overflow-y: auto;
  }

  .hidden {
    display: none !important;
  }

  .row {
    background: #1a1a1a;
    padding: 8px 12px;
    margin: 6px 0;
    border-radius: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }

  .deleteBtn {
    color: red;
    cursor: pointer;
    font-weight: bold;
    font-size: 18px;
  }

  button {
    padding: 8px 10px;
    border: none;
    border-radius: 6px;
    background: #001aff;
    color: white;
    cursor: pointer;
  }

  .upload-job {
    padding: 8px 10px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }

  .upload-job.uploading span {
    color: #facc15;
  }

  .upload-job.complete span {
    color: #22c55e;
  }

  .upload-job.failed span {
    color: #ef4444;
  }

  .upload-job small {
    display: block;
    color: #ef4444;
    margin-top: 4px;
  }

  .notification-message {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 14px;
    line-height: 1.2;
    flex-wrap: wrap;
  }

  .notifHeader {
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .viewSuggestionsBtn {
    padding: 4px 8px;
    font-size: 12px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    flex-shrink: 0;
  }

  .suggestionsBox {
    width: 100%;
    margin-top: 8px;
    padding: 8px;
    background: #111;
    border-radius: 6px;
    line-height: 1.4;
    font-size: 13px;
    max-height: 300px;
    overflow-y: auto;
  }

 #adminBlocked {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: #000;
}

.adminLockoutImage {
  width: 100%;
  height: 100%;
  background-image: url("/assets/lockout.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

.deleteNotificationBtn {
  padding: 4px 8px;
  font-size: 12px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  background: #5a0000;
  color: white;
  flex-shrink: 0;
}

.artistFolder {
  margin-bottom: 8px;
}

.artistFolderHeader {
  padding: 10px 12px;
  background: #111;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.artistFolderHeader:hover {
  background: #1a1a1a;
}

.artistFolderHeader span {
  color: #888;
  font-size: 12px;
  font-weight: normal;
}

.artistFolderSongs {
  margin-top: 6px;
  padding-left: 14px;
}

.duplicateFolder {
  margin-bottom: 12px;
}

.duplicateFolderHeader {
  padding: 10px 12px;
  background: #2a0000;
  border: 1px solid rgba(255, 0, 0, 0.35);
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.duplicateFolderSongs {
  margin-top: 6px;
  padding-left: 14px;
}

.duplicateInfo {
  color: #aaa;
  font-size: 12px;
  margin-top: 4px;
}

.deleteDuplicateBtn {
  padding: 4px 8px;
  font-size: 12px;
  background: #7a0000;
}

</style>
</head>

<body>

<div id="adminBlocked" class="hidden">
  <div class="adminLockoutImage"></div>
</div>

<div id="adminContent" class="app">

  <div class="sidebar">
    <h2>Admin</h2>
    <p data-page="library"> Library</p>
    <p data-page="upload"> Upload</p>
    <p data-page="settings"> Settings</p>
    <p data-page="notifications"> Notifications</p>
  </div>

  <div class="main">

    <div id="library">
     <h2>All Songs</h2>

<button id="scanDuplicatesBtn">
  🔍 Scan For Duplicates
</button>

<br><br>

<div id="duplicateFolder"></div>

<div id="songList"></div>
    </div>

    <div id="upload" class="hidden">
      <h2>Upload Songs</h2>

      <input type="file" id="fileInput" multiple />
      <br><br>
      <button id="uploadSongsBtn">Upload</button>

      <section class="admin-card">
        <h2>Live Folder Uploads</h2>
        <div id="uploadStatusSummary">No uploads yet.</div>
        <div id="uploadStatusList"></div>
      </section>
    </div>

    <div id="settings" class="hidden">
      <h2>Settings</h2>

      <input type="file" id="bgFile" />
      <br><br>
      <button id="uploadBackgroundBtn">Upload Background</button>
      <button id="deleteAllContentBtn">
        Delete All Content
      </button>

      <p id="bgStatus"></p>
    </div>

    <div id="notifications" class="hidden">
  <h2>Notifications</h2>

  <button id="discoverArtistsBtn">
    Generate Missing Artist Suggestions
  </button>

  <br><br>

  <div id="notifList"></div>
</div>

  </div>

</div>

<script src="/js/config.js"></script>
<script src="/js/constants.js"></script>
<script src="/js/api.js"></script>
<script src="/admin/admin.js"></script>

</body>
</html>
