<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>

  <style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0d0d0d;
    color: white;
  }

  .app {
    display: flex;
    height: 100vh;
  }

  .sidebar {
    width: 220px;
    padding: 20px;
    background: #000;
  }

  .sidebar h2 {
    color: #0000ff;
  }

  .sidebar p {
    padding: 10px;
    cursor: pointer;
  }

  .sidebar p:hover {
    color: #0d00ff;
  }

  .sidebar p {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .activity-badge {
    min-width: 20px;
    height: 20px;
    padding: 0 6px;
    border-radius: 999px;
    background: #ef4444;
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: bold;
  }

  .main {
    flex: 1;
    padding: 30px;
    overflow-y: auto;
  }

  .hidden {
    display: none !important;
  }

  .row {
    background: #1a1a1a;
    padding: 8px 12px;
    margin: 6px 0;
    border-radius: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }

  .deleteBtn {
    color: red;
    cursor: pointer;
    font-weight: bold;
    font-size: 18px;
  }

  button {
    padding: 8px 10px;
    border: none;
    border-radius: 6px;
    background: #001aff;
    color: white;
    cursor: pointer;
  }

  .upload-job {
    padding: 8px 10px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }

  .upload-job.uploading span {
    color: #facc15;
  }

  .upload-job.complete span {
    color: #22c55e;
  }

  .upload-job.failed span {
    color: #ef4444;
  }

  .upload-job small {
    display: block;
    color: #ef4444;
    margin-top: 4px;
  }

  .notification-message {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 14px;
    line-height: 1.2;
    flex-wrap: wrap;
  }

  .notifHeader {
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .viewSuggestionsBtn {
    padding: 4px 8px;
    font-size: 12px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    flex-shrink: 0;
  }

  .suggestionsBox {
    width: 100%;
    margin-top: 8px;
    padding: 8px;
    background: #111;
    border-radius: 6px;
    line-height: 1.4;
    font-size: 13px;
    max-height: 300px;
    overflow-y: auto;
  }

 #adminBlocked {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: #000;
}

.adminLockoutImage {
  width: 100%;
  height: 100%;
  background-image: url("/assets/lockout.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

.deleteNotificationBtn {
  padding: 4px 8px;
  font-size: 12px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  background: #5a0000;
  color: white;
  flex-shrink: 0;
}

.artistFolder {
  margin-bottom: 8px;
}

.artistFolderHeader {
  padding: 10px 12px;
  background: #111;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.artistFolderHeader:hover {
  background: #1a1a1a;
}

.artistFolderHeader span {
  color: #888;
  font-size: 12px;
  font-weight: normal;
}

.artistFolderSongs {
  margin-top: 6px;
  padding-left: 14px;
}

.duplicateFolder {
  margin-bottom: 12px;
}

.duplicateFolderHeader {
  padding: 10px 12px;
  background: #2a0000;
  border: 1px solid rgba(255, 0, 0, 0.35);
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.duplicateFolderSongs {
  margin-top: 6px;
  padding-left: 14px;
}

.duplicateInfo {
  color: #aaa;
  font-size: 12px;
  margin-top: 4px;
}

.deleteDuplicateBtn {
  padding: 4px 8px;
  font-size: 12px;
  background: #7a0000;
}

.activity-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.activity-actions,
.activity-filters {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.activity-filters select {
  padding: 8px 10px;
  border: 1px solid #333;
  border-radius: 6px;
  background: #111;
  color: #fff;
}

.activity-summary {
  color: #aaa;
  font-size: 13px;
  margin-bottom: 12px;
}

.activity-item {
  position: relative;
  background: #171717;
  border: 1px solid #292929;
  border-radius: 10px;
  padding: 12px 14px;
  margin: 8px 0;
}

.activity-item.unread {
  border-color: rgba(0, 26, 255, 0.7);
  box-shadow: inset 3px 0 0 #001aff;
}

.activity-item-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.activity-title {
  font-weight: bold;
}

.activity-time {
  color: #888;
  font-size: 12px;
  white-space: nowrap;
}

.activity-identity {
  margin-top: 7px;
  font-size: 14px;
}

.activity-details {
  margin-top: 8px;
  color: #aaa;
  font-size: 12px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.activity-tag {
  display: inline-block;
  padding: 2px 7px;
  margin-right: 6px;
  border-radius: 999px;
  background: #292929;
  color: #ddd;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.activity-tag.bot {
  background: #4a2d00;
  color: #ffd08a;
}

.activity-tag.failed {
  background: #4a0000;
  color: #ffaaaa;
}

#clearActivityBtn {
  background: #650000;
}

.empty-state {
  padding: 24px;
  border: 1px dashed #333;
  border-radius: 10px;
  color: #888;
  text-align: center;
}

</style>
</head>

<body>

<div id="adminBlocked" class="hidden">
  <div class="adminLockoutImage"></div>
</div>

<div id="adminContent" class="app">

  <div class="sidebar">
    <h2>Admin</h2>
    <p data-page="library"> Library</p>
    <p data-page="upload"> Upload</p>
    <p data-page="settings"> Settings</p>
    <p data-page="notifications"> Notifications</p>
    <p data-page="activity">
      <span>Activity</span>
      <span id="activityUnreadBadge" class="activity-badge hidden">0</span>
    </p>
  </div>

  <div class="main">

    <div id="library">
     <h2>All Songs</h2>

<button id="scanDuplicatesBtn">
  🔍 Scan For Duplicates
</button>

<br><br>

<div id="duplicateFolder"></div>

<div id="songList"></div>
    </div>

    <div id="upload" class="hidden">
      <h2>Upload Songs</h2>

      <input type="file" id="fileInput" multiple />
      <br><br>
      <button id="uploadSongsBtn">Upload</button>

      <section class="admin-card">
        <h2>Live Folder Uploads</h2>
        <div id="uploadStatusSummary">No uploads yet.</div>
        <div id="uploadStatusList"></div>
      </section>
    </div>

    <div id="settings" class="hidden">
      <h2>Settings</h2>

      <input type="file" id="bgFile" />
      <br><br>
      <button id="uploadBackgroundBtn">Upload Background</button>
      <button id="deleteAllContentBtn">
        Delete All Content
      </button>

      <p id="bgStatus"></p>
    </div>

    <div id="notifications" class="hidden">
  <h2>Notifications</h2>

  <button id="discoverArtistsBtn">
    Generate Missing Artist Suggestions
  </button>

  <br><br>

  <div id="notifList"></div>
</div>

    <div id="activity" class="hidden">
      <h2>Visitor & Login Activity</h2>

      <div class="activity-toolbar">
        <div class="activity-filters">
          <label for="activityFilter">Show:</label>
          <select id="activityFilter">
            <option value="all">All activity</option>
            <option value="unread">Unread only</option>
            <option value="logins">Logins & registrations</option>
            <option value="failed">Failed logins</option>
            <option value="visits">Page visits</option>
            <option value="bots">Bots</option>
          </select>
        </div>

        <div class="activity-actions">
          <button id="refreshActivityBtn">Refresh</button>
          <button id="markActivityReadBtn">Mark all read</button>
          <button id="clearActivityBtn">Clear activity</button>
        </div>
      </div>

      <div id="activitySummary" class="activity-summary">
        Loading activity…
      </div>

      <div id="activityList"></div>
    </div>

  </div>

</div>

<script src="/js/config.js"></script>
<script src="/js/constants.js"></script>
<script src="/js/api.js"></script>
<script src="/admin/admin.js"></script>

</body>
</html>
