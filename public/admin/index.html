<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0d0d0d;
      color: white;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 220px;
      padding: 20px;
      background: #000;
    }

    .sidebar h2 { color: #0000ff; }

    .sidebar p {
      padding: 10px;
      cursor: pointer;
    }

    .sidebar p:hover { color: #0d00ff; }

    .main {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
    }

    .hidden {
      display: none !important;
    }

    .row {
      background: #1a1a1a;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .deleteBtn {
      color: red;
      cursor: pointer;
      font-weight: bold;
      font-size: 18px;
    }

    button {
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #001aff;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="sidebar">
    <h2>Admin</h2>
    <p data-page="library"> Library</p>
    <p data-page="upload"> Upload</p>
    <p data-page="settings"> Settings</p>
    <p data-page="notifications"> Notifications</p>
  </div>

  <div class="main">

    <div id="library">
      <h2>All Songs</h2>
      <div id="songList"></div>
    </div>

    <div id="upload" class="hidden">
      <h2>Upload Songs</h2>

      <input type="file" id="fileInput" multiple />
      <br><br>
      <button id="uploadSongsBtn">Upload</button>

      <p id="status"></p>
    </div>

    <div id="settings" class="hidden">
      <h2>Settings</h2>

      <input type="file" id="bgFile" />
      <br><br>
      <button id="uploadBackgroundBtn">Upload Background</button>
      <button id="deleteAllContentBtn">
        Delete All Content
      </button>

      <p id="bgStatus"></p>
    </div>

    <div id="notifications" class="hidden">
      <h2>Notifications</h2>
      <div id="notifList"></div>
    </div>

    <div id="uploadProgressWrap" style="width:100%;background:#222;border-radius:8px;overflow:hidden;margin-top:12px;">
  <div id="uploadProgressBar" style="width:0%;height:14px;background:#004cff;"></div>
</div>

<p id="uploadProgressText">0%</p>

  </div>

</div>

<script src="/js/config.js"></script>
<script src="/js/constants.js"></script>
<script src="/js/api.js"></script>

<script>

function show(page) {
  document.querySelectorAll(".main > div").forEach(d => d.classList.add("hidden"));
  document.getElementById(page).classList.remove("hidden");

  if (page === "notifications") loadNotifications();
}

document.querySelectorAll("[data-page]").forEach(btn => {
  btn.addEventListener("click", () => {
    show(btn.dataset.page);
  });
});

document.getElementById("uploadSongsBtn")
  ?.addEventListener("click", uploadFiles);

document.getElementById("uploadBackgroundBtn")
  ?.addEventListener("click", uploadBackground);

document.getElementById("songList")
  ?.addEventListener("click", (e) => {
    const deleteBtn = e.target.closest("[data-song-id]");
    if (!deleteBtn) return;

    deleteSong(deleteBtn.dataset.songId);
  });
  
async function loadSongs() {
  await loadConfig();

  const data = await apiFetch("/api/songs");

  if (!data?.songs) {
    document.getElementById("songList").innerHTML = "Failed to load songs";
    return;
  }

  const sorted = data.songs.sort((a, b) =>
    a.title.localeCompare(b.title)
  );

  document.getElementById("songList").innerHTML =
    sorted.map(s => `
      <div class="row">
        <div>${s.title} - ${s.artist}</div>
        <div class="deleteBtn" data-song-id="${s.id}">−</div>
      </div>
    `).join("");
}

/* DELETE SONG */
function deleteSong(id) {
  if (!confirm("Delete this song?")) return;

  apiFetch("/api/songs/" + id, { method: "DELETE" })
    .then(() => loadSongs());
}

/* UPLOAD SONGS */
async function uploadFiles() {
  await loadConfig();

  const files = Array.from(document.getElementById("fileInput").files);
  const status = document.getElementById("status");
  const bar = document.getElementById("uploadProgressBar");
  const text = document.getElementById("uploadProgressText");

  if (!files.length) {
    status.innerText = "No files selected";
    return;
  }

  const batchSize = 5;
  let uploaded = 0;

  bar.style.width = "0%";
  text.innerText = `0 of ${files.length} songs uploaded`;
  status.innerText = "Uploading...";

  for (let i = 0; i < files.length; i += batchSize) {
    const batch = files.slice(i, i + batchSize);
    const formData = new FormData();

    batch.forEach(file => {
      formData.append("songs", file);
    });

    let data;

try {
  data = await apiFetch("/api/upload-files", {
    method: "POST",
    body: formData
  });
} catch (err) {
  status.innerText = err.message || "Upload failed";
  return;
}

    if (!data?.success) {
  status.innerText = `Upload failed at song ${uploaded + 1}`;
  return;
}

const failed = data.results?.filter(r => !r.success) || [];

if (failed.length) {
  console.warn("Failed uploads:", failed);
  status.innerText = `${failed.length} file(s) failed. Check console.`;
}

uploaded += batch.length;

    const percent = Math.round((uploaded / files.length) * 100);

    bar.style.width = `${percent}%`;
    text.innerText = `${uploaded} of ${files.length} songs uploaded`;
  }

  status.innerText = "Upload complete!";
  text.innerText = `${files.length} of ${files.length} songs uploaded`;

  document.getElementById("fileInput").value = "";

  await loadSongs();
}

/* 🔥 FIXED BACKGROUND UPLOAD */
async function uploadBackground() {
  await loadConfig();

  const file = document.getElementById("bgFile").files[0];
  const status = document.getElementById("bgStatus");

  if (!file) {
    status.innerText = "No file selected";
    return;
  }

  const formData = new FormData();
  formData.append("file", file);

  status.innerText = "Uploading...";

  let data;

try {
  data = await apiFetch("/api/upload-bg", {
    method: "POST",
    body: formData
  });
} catch (err) {
  status.innerText = err.message || "Upload failed";
  return;
}

  if (!data?.success) {
    status.innerText = data?.error || "Upload failed";
    return;
  }

  status.innerText = "Upload successful!";
}

/* NOTIFICATIONS */
async function loadNotifications() {
  await loadConfig();

  const data = await apiFetch("/api/notifications");

  if (!data?.notifications) {
    document.getElementById("notifList").innerHTML =
      "Failed to load notifications";
    return;
  }

  document.getElementById("notifList").innerHTML =
    data.notifications.map(n => `
      <div class="row">
        [${n.time}] ${n.type}: ${n.message}
      </div>
    `).join("");
}

document.getElementById("deleteAllContentBtn")
  ?.addEventListener("click", async () => {
    const code = prompt("Enter delete code:");

    if (code !== "2009") {
      alert("Wrong code.");
      return;
    }

    const data = await apiFetch("/api/admin/delete-all-content", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      credentials: "include",
      body: JSON.stringify({ code })
    });

    if (!data?.success) {
      alert(data?.error || "Delete failed");
      return;
    }

    alert("All content deleted.");
    location.reload();
  });

loadSongs();

</script>

</body>
</html>
