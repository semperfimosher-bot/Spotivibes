<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0d0d0d;
      color: white;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 220px;
      padding: 20px;
      background: #000;
    }

    .sidebar h2 { color: #0000ff; }

    .sidebar p {
      padding: 10px;
      cursor: pointer;
    }

    .sidebar p:hover { color: #0d00ff; }

    .main {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
    }

    .hidden {
      display: none !important;
    }

    .row {
      background: #1a1a1a;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .deleteBtn {
      color: red;
      cursor: pointer;
      font-weight: bold;
      font-size: 18px;
    }

    button {
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #001aff;
      cursor: pointer;
    }

    .upload-job {
  padding: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}

.upload-job.uploading span {
  color: #facc15;
}

.upload-job.complete span {
  color: #22c55e;
}

.upload-job.failed span {
  color: #ef4444;
}

.upload-job small {
  display: block;
  color: #ef4444;
  margin-top: 4px;
}

.notification-message {
  white-space: pre-wrap;
  line-height: 1.5;
}

  </style>
</head>

<body>

<div class="app">

  <div class="sidebar">
    <h2>Admin</h2>
    <p data-page="library"> Library</p>
    <p data-page="upload"> Upload</p>
    <p data-page="settings"> Settings</p>
    <p data-page="notifications"> Notifications</p>
  </div>

  <div class="main">

    <div id="library">
      <h2>All Songs</h2>
      <div id="songList"></div>
    </div>

    <div id="upload" class="hidden">
      <h2>Upload Songs</h2>

      <input type="file" id="fileInput" multiple />
      <br><br>
      <button id="uploadSongsBtn">Upload</button>

      <section class="admin-card">
        <h2>Live Folder Uploads</h2>
        <div id="uploadStatusSummary">No uploads yet.</div>
        <div id="uploadStatusList"></div>
      </section>
    </div>

    <div id="settings" class="hidden">
      <h2>Settings</h2>

      <input type="file" id="bgFile" />
      <br><br>
      <button id="uploadBackgroundBtn">Upload Background</button>
      <button id="deleteAllContentBtn">
        Delete All Content
      </button>

      <p id="bgStatus"></p>
    </div>

    <div id="notifications" class="hidden">
      <h2>Notifications</h2>
      <div id="notifList"></div>
    </div>

    <div id="uploadProgressWrap" style="width:100%;background:#222;border-radius:8px;overflow:hidden;margin-top:12px;">
  <div id="uploadProgressBar" style="width:0%;height:14px;background:#004cff;"></div>
</div>

<p id="uploadProgressText">0%</p>

  </div>

</div>

<script src="/js/config.js"></script>
<script src="/js/constants.js"></script>
<script src="/js/api.js"></script>
<script src="/admin/admin.js"></script>

</body>
</html>
